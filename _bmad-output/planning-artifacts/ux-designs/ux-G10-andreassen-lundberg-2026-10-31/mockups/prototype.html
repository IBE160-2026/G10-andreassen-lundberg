  }
  function candidate(id){const c={...base[id]};if(id==='V01'&&state.version==='d2'){c.status='good';c.desc='Tilgjengeligheten er bekreftet i d2. Avtalte timer og syntetisk sats mangler fortsatt.';}return c;}
  function key(id){return [state.version,state.target,id].join(':');}
  function record(id){return state.records[key(id)];}
  function shift(){return shifts.find(x=>x.id===state.target)||shifts[1];}
  function status(c){return c.status==='good'?'Oppfyller scenarioreglene':c.status==='bad'?'Regelavvik':c.status==='partial'?'Oppfyller scenarioreglene':'Uavklart';}
  function badge(text,kind='neutral'){return '<span class="badge '+kind+'">'+esc(text)+'</span>';}
  function announce(text){$('#announcer').textContent='';requestAnimationFrame(()=>{$('#announcer').textContent=text;});}
  function focusMain(){requestAnimationFrame(()=>{const h=$('#page-title');if(h)h.focus({preventScroll:true});});}
  function go(screen){if(screen==='choice'){state.active=state.current;screen='details';}if(state.screen==='results')state.resultScroll=window.scrollY;state.screen=screen;state.error='';render();if(screen==='results')window.scrollTo(0,state.resultScroll);else window.scrollTo(0,0);focusMain();}
  function bindTarget(){state.current=state.choices?state.choices[state.version+':'+state.target]||null:null;}
  function invalidate(){state.simulated=false;state.result='idle';state.error='';state.errorField='';state.notice='Feltene er endret. Simuler fraværet på nytt før du søker.';}
  function datePlus(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
  function shortDate(iso){const [y,m,d]=iso.split('-');return Number(d)+'.'+m+'.'+y;}
  function period(){const s=shifts.find(x=>x.id===state.start)||shifts[1];const n=Number(state.days);return {from:s.date,to:datePlus(s.date,Number.isInteger(n)&&n>0&&n<366?n:1),last:datePlus(s.date,Number.isInteger(n)&&n>0&&n<366?n-1:0)};}
  function affected(){const p=period();return shifts.filter(x=>{const start=x.date+'T'+x.start.replace('.',':');const end=x.endDate+'T'+x.end.replace('.',':');return start<p.to+'T00:00'&&end>p.from+'T00:00';});}
  function criteriaLabel(){return state.criteria.map(x=>x.toUpperCase()).join(' → ');}
  function ranked(){let list=['A02','A03'];if(state.version==='d2'&&!state.criteria.includes('p2'))list.push('V01');return list.map(candidate).sort((a,b)=>{for(const p of state.criteria){const delta=p==='p1'?a.after-b.after:(a.after/a.contract)-(b.after/b.contract);if(delta)return delta;}return a.id.localeCompare(b.id);});}
  function sameRank(a,b){return state.criteria.every(p=>p==='p1'?a.after===b.after:a.after/a.contract===b.after/b.contract);}
  function stepNav(){
    const active=state.screen==='absence'?0:state.screen==='results'?1:state.screen==='details'?(state.current===state.active?2:1):-1;
    const items=[['absence','Fravær'],['results','Alternativer'],['choice','Valg']];
    return '<nav class="steps" aria-label="Arbeidsflyt">'+items.map(([s,t],i)=>(i?'<span class="step-sep" aria-hidden="true">›</span>':'')+'<button class="step" data-action="nav" data-screen="'+s+'" '+(active===i?'aria-current="step"':'')+' '+((s==='results'&&state.result==='idle')||(s==='choice'&&!state.current)?'disabled':'')+'><span aria-hidden="true">'+(i+1)+'</span>'+t+'</button>').join('')+'</nav>';
  }
  function context(){const s=shift();return '<aside class="panel context" aria-label="Gjeldende vaktkontekst"><p class="eyebrow">Vakten vi undersøker</p><div class="date-block"><p class="day">'+esc(s.date==='2026-10-14'?'Onsdag 14. okt.':shortDate(s.date))+'</p><p class="mono">'+esc(s.start+'–'+s.end)+(s.endDate!==s.date?' · til '+shortDate(s.endDate):'')+'</p></div><dl><div><dt>Fraværende</dt><dd>A01 · intern ansatt</dd></div><div><dt>Behov</dt><dd>1 person med K1</dd></div><div><dt>Gjeldende bemanning</dt><dd>'+badge(state.absences.includes(state.target)?'Udekket':'A01 planlagt',state.absences.includes(state.target)?'warn':'neutral')+'</dd></div><div><dt>Datagrunnlag</dt><dd>'+esc(state.version)+' · uke 5</dd></div></dl><p class="context-note">'+(state.current?'Et alternativ er valgt i økten. ':'')+'Forslag og simulerte svar endrer ikke den faktiske vaktlisten.</p></aside>';}
  function pageHead(eyebrow,title,description,action=''){return '<div class="page-head"><div><p class="eyebrow" style="margin-bottom:10px">'+esc(eyebrow)+'</p><h1 id="page-title" tabindex="-1">'+esc(title)+'</h1><p>'+esc(description)+'</p></div>'+action+'</div>';}
  function currentBanner(){if(!state.current)return '';const c=candidate(state.current);return '<div class="notice choice-banner"><strong>Øktvalg: '+esc(c.id)+'</strong><p>Valgt på '+esc(state.version)+'. '+esc(offerStatus(record(c.id)))+' Den faktiske vaktlisten er fortsatt uendret.</p><button class="small" data-action="detail" data-id="'+c.id+'">Se valget</button></div>';}
  function week(){const shiftsText=[['Mandag','12. okt.','A04','08.00–16.00','Låst i datasettet'],['Tirsdag','13. okt.','A03','08.00–16.00','Avsluttet'],['Onsdag','14. okt.','A01','08.00–16.00','Aktuell vakt'],['Torsdag','15. okt.','A01','08.00–16.00','Planlagt'],['Fredag','16. okt.','A01','08.00–16.00','Låst i datasettet']];const targetByDay=['','','w','t','f'];const unavailable=i=>state.absences.includes(targetByDay[i]);return pageHead('Ukeplan · uke 5','God oversikt før du velger.','Planlagte vakter og bemanningsbehov i et avgrenset, syntetisk UX-eksempel. Klokken i demoen er onsdag 14. oktober 2026 kl. 07.00.','<button class="primary" data-action="absence" data-testid="absence-open">Registrer fravær</button>')+currentBanner()+'<dl class="week-summary"><div><dt>Periode i arbeidsuken</dt><dd>12.–18. oktober<small class="muted">2026 · Europe/Oslo</small></dd></div><div><dt>Aktuelt bemanningsbehov</dt><dd>1 × K1<small class="muted">Onsdag 08.00–16.00</small></dd></div><div><dt>Simulert fravær</dt><dd>'+state.absences.length+' målskift<small class="muted">'+esc(state.version)+' · valg innføres ikke her</small></dd></div></dl><div class="week-toolbar"><h2>Gjeldende vaktliste</h2>'+badge('Datasettets låser beholdes')+'</div><div class="week-grid" data-testid="week-grid">'+shiftsText.map((d,i)=>'<section class="week-day '+(i===2?'current':'')+'"><h3>'+d[0]+'<br>'+d[1]+'</h3><div class="week-card '+(unavailable(i)?'alert':'')+'"><span class="mono">'+d[3]+'</span><strong>'+((unavailable(i))?'Udekket':d[2])+'</strong>'+badge(unavailable(i)?'Mangler 1 × K1':d[4],unavailable(i)?'warn':'neutral')+'<p>Behov: 1 person med K1.<br>'+((unavailable(i))?'Fravær er simulert for A01.':'Planlagt tildeling i eksemplet.')+'</p>'+(i===2?'<button data-action="absence">'+(state.absences.includes('w')?'Se simulert fravær':'Registrer fravær')+'</button>':'')+'</div></section>').join('')+'</div><div class="notice" style="margin-top:20px"><strong>Dette er et utsnitt.</strong><p>Vaktkortene illustrerer behov, låser og gjeldende tildeling. Hele demodatasettet og kontrollen av bemanning implementeres i appens egne saker. Historikken for uke 1–4 vises som kontekst i alternativdetaljene.</p></div>';}
  function absence(){const p=period();return pageHead('Steg 1 · fravær','Hvilken vakt trenger dekning?','Velg en konkret vakt. Kalenderperioden viser hvilke vakter som berøres; bare det valgte målskiftet simuleres nå.')+'<div class="layout">'+context()+'<section class="panel"><h2 style="margin-bottom:22px">Registrer simulert fravær</h2><form id="absence-form" novalidate><div id="form-error" '+(state.error?'role="alert"':'')+' class="error" tabindex="-1">'+(state.error?'<a href="#'+esc(state.errorField)+'">'+esc(state.error)+'</a>':'')+'</div><div class="field"><label for="person">Fraværende ansatt</label><select id="person" name="person" aria-describedby="person-hint'+(state.errorField==='person'?' form-error':'')+'" aria-invalid="'+(state.errorField==='person'?'true':'false')+'" data-testid="person"><option value="">Velg ansatt</option><option value="A01" '+(state.person==='A01'?'selected':'')+'>A01 · intern ansatt</option></select><p class="hint" id="person-hint">Velg hvem det simulerte fraværet gjelder.</p></div><div class="field-row"><div class="field"><label for="start">Startvakt</label><select id="start" name="start" data-testid="start-shift">'+shifts.map(s=>'<option value="'+s.id+'" '+(s.id===state.start?'selected':'')+' '+(s.started?'disabled':'')+'>'+esc(s.label)+(s.started?' · påbegynt':s.locked?' · låst':'')+'</option>').join('')+'</select><p class="hint">Neste planlagte vakt foreslås fra demoens vurderingstidspunkt. Startvakten kan endres.</p></div><div class="field"><label for="days">Antall kalenderdager</label><input id="days" name="days" type="number" min="1" step="1" value="'+esc(state.days)+'" inputmode="numeric" aria-describedby="days-hint'+(state.errorField==='days'?' form-error':'')+'" aria-invalid="'+(state.errorField==='days'?'true':'false')+'" data-testid="days"><p class="hint" id="days-hint">1 er en redigerbar standardverdi. Faktisk fraværsvarighet kan være ukjent.</p></div></div><section aria-labelledby="affected-title"><div class="section-title"><h3 id="affected-title">Berørte vakter</h3><span class="small muted" id="period-label">'+shortDate(p.from)+'–'+shortDate(p.last)+'</span></div><p class="hint" style="margin-bottom:12px">Velg én hel vakt å undersøke. Nattvakter som overlapper perioden vises med begge datoene.</p><ul class="shift-list" id="affected-list">'+affectedHTML()+'</ul></section><div class="notice '+(state.simulated?'':'warn')+'" style="margin-top:22px" id="absence-state"><strong>'+(state.simulated?'Fraværet er simulert for valgt målskift.':'Ingen endring før du simulerer.')+'</strong><p>'+(state.simulated?'Finn alternativer er nå tilgjengelig. Gjeldende bemanningsgrunnlag har én udekket plass.':esc(state.notice||'Perioden er en forhåndsvisning. Ingen andre vakter registreres automatisk som fravær.'))+'</p></div><div class="actions"><button type="submit" class="'+(!state.simulated?'primary':'')+'" data-testid="simulate">Simuler fravær</button><button type="button" class="'+(state.simulated?'primary':'')+'" data-action="search" data-testid="search" '+(!state.simulated?'disabled':'')+'>Finn alternativer <span aria-hidden="true">→</span></button></div></form></section></div>';}
  function affectedHTML(){return affected().map(s=>'<li class="shift-item '+(s.started?'disabled':'')+'"><input type="radio" name="target" id="target-'+s.id+'" value="'+s.id+'" '+(state.target===s.id?'checked':'')+' '+(s.started?'disabled':'')+'><label for="target-'+s.id+'"><strong>'+esc(s.label)+'</strong><span>'+(s.started?'Påbegynt ved demoens vurderingstidspunkt · kan ikke velges':s.locked?'Låst for flytting · fravær kan simuleres':'Behov: 1 × K1 · hele vakten undersøkes')+'</span></label></li>').join('')||'<li class="notice">Ingen vakter i perioden. Velg en annen startvakt.</li>';}
  function settings(){return '<details class="panel settings" data-testid="search-settings"><summary>Søkeomfang og sortering <span class="muted small">· '+criteriaLabel()+' · maks '+state.limit+' flytting</span></summary><div class="settings-grid"><div><p class="setting-head">Aktive kriterier</p>'+[['p1','P1 · færrest planlagte timer','Timer etter hele forslaget.'],['p2','P2 · lavest andel av avtalte timer','Krever kjent, positivt avtalt timetall.']].map(([id,title,desc])=>'<label class="criterion"><input type="checkbox" data-criterion="'+id+'" '+(state.criteria.includes(id)?'checked':'')+' data-testid="criterion-'+id+'"><span><strong>'+title+'</strong><small>'+desc+'</small></span></label>').join('')+'<label class="setting-head" for="order">Prioritert rekkefølge</label><select id="order" class="setting-select" '+(state.criteria.length<2?'disabled':'')+'><option value="p1,p2" '+(state.criteria[0]==='p1'?'selected':'')+'>P1 først, deretter P2</option><option value="p2,p1" '+(state.criteria[0]==='p2'?'selected':'')+'>P2 først, deretter P1</option></select><p class="hint">Minst ett kriterium. Kostnad påvirker ikke rangeringen. Like verdier på alle aktive kriterier gir lik rangering.</p></div><div><label class="setting-head" for="limit">Maksimalt antall flyttinger</label><select id="limit" class="setting-select" data-testid="search-limit"><option value="0" '+(state.limit==='0'?'selected':'')+'>0 · bare direkte erstatning</option><option value="1" '+(state.limit==='1'?'selected':'')+'>1 · direkte eller én flytting</option></select><p class="hint">Datasettets låste og påbegynte tildelinger beskyttes. Nytt omfang krever nytt eksplisitt søk.</p><button class="small" style="margin-top:12px" data-action="search" data-testid="search-again">Finn alternativer på nytt</button></div></div></details>';}
  function card(c,index,list){const rank=index>0&&sameRank(c,list[index-1])?list.slice(0,index).findIndex(x=>sameRank(x,c))+1:index+1;const tied=list.filter(x=>sameRank(x,c)).length>1;return '<article class="candidate '+(index===0?'top':'')+'" data-testid="candidate-'+c.id+'">'+(index===0?'<div class="candidate-topline">Øverst etter '+criteriaLabel()+' · '+(tied?'lik rangering med andre alternativer':'ingen automatisk anbefaling eller aksept')+'</div>':'')+'<div class="candidate-inner"><div class="candidate-head"><div class="person"><span class="avatar" aria-hidden="true">'+esc(c.id)+'</span><div><h3>'+esc(c.id==='M01'?'B + C':c.id)+'</h3><p>'+esc(c.kind)+'</p></div></div><div class="badges">'+badge(c.status==='good'?'Oppfyller scenarioreglene':status(c),c.status==='good'?'good':'warn')+(state.current===c.id?badge('Valgt i økten','good'):'')+'</div></div><p class="candidate-desc">'+esc(c.desc)+'</p><dl class="metrics"><div class="metric"><dt>Planlagte timer · P1</dt><dd>'+c.before+' → '+c.after+' t<small>'+ (state.criteria.includes('p2')?'P2: '+(c.contract?dec(c.after/c.contract*100)+' %':'uavklart'):'Etter hele forslaget')+'</small></dd></div><div class="metric"><dt>Hvile før / etter</dt><dd>'+c.rest[0]+' / '+c.rest[1]+' t<small>Alle berørte i detaljene</small></dd></div><div class="metric"><dt>Anslag · syntetisk</dt><dd>'+(c.cost===null?'Uavklart':money(c.cost))+'<small>'+(c.cost===null?'Sats mangler':'Differanse +'+money(c.cost-c.ref))+'</small></dd></div></dl><div class="card-bottom"><p>Full dekning i forslaget · rang '+rank+(tied?' (lik rangering)':'')+'<br>'+esc(state.version)+' · eksempeltall, ikke regelmotorfasit</p><button data-action="detail" data-id="'+c.id+'" data-testid="inspect-'+c.id+'">Undersøk <span aria-hidden="true">↗</span></button></div></div></article>';}
  function other(c){const reason=c.id==='V01'&&c.status==='good'?'Oppfyller scenarioreglene, men P2 kan ikke beregnes. Ingen skjult sortering med P1.':c.desc;return '<article class="other-row" data-testid="candidate-'+c.id+'"><div><strong>'+esc(c.id==='PART'?'B → X · Y udekket':c.id)+'</strong> '+badge(status(c),c.status==='bad'?'bad':c.status==='good'||c.status==='partial'?'good':'warn')+(c.status==='partial'?' '+badge('Delvis dekning','warn'):'')+'<p>'+esc(reason)+'</p></div><button class="small" data-action="detail" data-id="'+c.id+'" data-testid="inspect-'+c.id+'">Undersøk</button></article>';}
  function results(){let content='';if(state.result==='outside'){content='<section class="panel empty-state"><h2>Ikke kjørt – utenfor prototypeeksemplet.</h2><p>Dette målskiftet kan forhåndsvises og simuleres, men eksempelverdiene for A02/A03 gjelder bare onsdag 14. oktober kl. 08–16. Ingen regelmotor er tilkoblet.</p><div class="actions"><button data-action="absence">Velg onsdagens morgenvakt</button></div></section>';}else if(state.result==='loading'){content='<section class="panel empty-state"><h2>Undersøker alternativene …</h2><p>Dette er en simulert ventetilstand i UX-prototypen.</p></section>';}else if(state.result==='error'){content='<section class="panel empty-state"><h2>Søket kunne ikke fullføres.</h2><p>Ingen konklusjon om at løsninger mangler. Fraværet og innstillingene er beholdt.</p><div class="actions"><button class="primary" data-action="retry">Prøv søket igjen</button><button data-action="absence">Tilbake til fraværet</button></div></section>';}else if(state.result==='empty'){content='<section class="panel empty-state"><h2>Ingen kontrollerte alternativer funnet innenfor valgt søkeomfang.</h2><p>Det kan fortsatt finnes uavklarte kandidater. Undersøk mangler og endre søkeomfang før et nytt søk.</p><div class="actions"><button class="primary" data-action="retry">Gå tilbake til vanlig eksempel</button><button data-action="detail" data-id="V01">Undersøk V01</button></div></section>';}else if(state.result==='idle'){content='<section class="panel empty-state"><h2>Nytt grunnlag trenger en ny vurdering.</h2><p>Gamle forslag og tilbudssvar gjelder ikke som kontroll av '+esc(state.version)+'. Fraværet er beholdt.</p><div class="actions"><button class="primary" data-action="search" '+(!state.simulated?'disabled':'')+'>Finn alternativer</button><button data-action="absence">Se fravær</button></div></section>';}else{const list=ranked();content='<div class="list-head"><h2>'+list.length+' komplette alternativer</h2><p class="small muted">Rangert etter '+criteriaLabel()+'</p></div><div class="cards" data-testid="ranked-candidates">'+list.map((c,i)=>card(c,i,list)).join('')+'</div><section class="other-findings"><h2>Andre funn som kan undersøkes</h2><p class="small muted">Mangler, regelavvik og delvis dekning holdes atskilt fra rangerte løsninger.</p>'+((state.version==='d1'||state.criteria.includes('p2'))?other(candidate('V01')):'')+other(candidate('A05'))+(state.limit==='1'?'<h2 style="margin-top:24px">Eget flytteeksempel</h2><p class="small muted">Konstruert annet scenario, uten felles rangering med A02/A03. X og Y er to berørte vakter i samme tidsrom.</p>'+other(candidate('M01'))+other(candidate('PART')):'')+'</section>';}
    return pageHead('Steg 2 · sammenlign','Hvem kan dekke vakten?','Undersøk konsekvensene før du velger. Reglene kontrolleres separat fra rangering og kostnad.')+'<div class="layout">'+context()+'<div>'+currentBanner()+'<dl class="strip"><div><dt>Gjeldende plan</dt><dd>Udekket · 1 × K1</dd></div><div><dt>Søkestatus</dt><dd data-testid="search-status">'+({full:'Fullført',empty:'Fullført',error:'Feilet / avbrutt',idle:'Ikke kjørt',loading:'Pågår',outside:'Ikke kjørt – utenfor eksempel'}[state.result])+'</dd></div><div><dt>Omfang</dt><dd>Maks '+state.limit+' flytting · '+esc(state.version)+'</dd></div></dl>'+settings()+content+'</div></div>';}
  function ruleRows(c){const values=[['R1 · kompetanse','K1 er til stede','good'],['R2 · tilgjengelighet',c.id==='V01'&&state.version==='d1'?'Ikke bekreftet for hele vakten':'Bekreftet for hele vakten',c.status==='unknown'?'warn':'good'],['R3 · overlapp','Ingen overlapp i eksemplet','good'],['R4 · hvile',c.rest[0]+' t før / '+c.rest[1]+' t etter · minst 11 t',c.status==='bad'?'bad':'good'],['R5 · arbeidstid',c.after+' t i scenarioets faste sjudagersperiode · maks 40 t','good']];return values.map(([name,value,kind])=>'<div class="rule-row"><strong>'+name+'</strong><span class="muted">'+esc(value)+'</span>'+badge(kind==='good'?'Oppfylt':kind==='bad'?'Regelavvik':'Uavklart',kind)+'</div>').join('');}
  function plan(c){const moved=c.id==='M01'||c.id==='PART';return '<section class="detail-section"><h3>Planforslag · alle berørte vakter</h3><div class="plan-pair"><div class="plan-box"><h4>Gjeldende vaktliste · '+esc(state.version)+'</h4><div class="plan-line"><strong>X · målskiftet</strong>Udekket · fravær for A01</div>'+(moved?'<div class="plan-line"><strong>Y · annen vakt i eksemplet</strong>B er planlagt · 8 t</div>':'')+'</div><div class="plan-box proposal"><h4>Beregnet forslag · ikke innført</h4><div class="plan-line"><strong>X · målskiftet</strong>'+esc(moved?'B':c.id)+' dekker hele vakten</div>'+(moved?'<div class="plan-line"><strong>Y · annen vakt i eksemplet</strong>'+(c.id==='PART'?'Udekket · mangler erstatter':'C dekker hele vakten · 8 t')+'</div>':'')+'</div></div><p class="hint">'+(moved?'B: 32 → 32 t, hvile 16/16 t. '+(c.id==='M01'?'C: 24 → 32 t, hvile 16/16 t. Begge har K1, bekreftet tilgjengelighet og ingen overlapp i dette konstruerte eksemplet.':'Ingen kandidat dekker Y. Dette er et delvis forslag og kan ikke velges som komplett løsning.'):'Alle andre tildelinger beholdes. Ingen vaktendring utføres av prototypen.')+'</p></section>';}
  function explanation(c){const top=state.result==='full'&&!['M01','PART'].includes(c.id)?ranked()[0]:null;return '<section class="detail-section"><h3>Forklaring</h3><p class="hint" style="margin-bottom:16px">Standardforklaring · basert på eksempelverdiene som vises. Ingen KI-modell er tilkoblet.</p><div class="explanation"><div><strong>Kort svar</strong><p>'+esc(c.desc)+'</p></div><div><strong>Avveining</strong><p>'+esc(c.status==='good'?'Eksempelverdiene oppfyller R1–R5. Dette er en forenklet scenariokontroll, ikke full lovkontroll.':c.status==='bad'?'R4 har et kjent avvik: 8 timers hvile før vakten. Avviket kan ikke godkjennes bort i grensesnittet.':c.status==='partial'?'Kontrollen av B kan være oppfylt, men Y er udekket. Hele forslaget er derfor ikke komplett.':'Tilgjengeligheten til V01 mangler. Ledig kalender er ikke bekreftet tilgjengelighet.')+'</p></div><div><strong>Konsekvenser</strong><p>'+esc(!top?'Ingen rangert referanse på dette grunnlaget. Standardforklaringen beskriver bare det undersøkte funnet.':c.id===top.id?'Dette alternativet står øverst etter '+criteriaLabel()+'. Lik rangering vises når alle aktive kriterier er like.':'Sammenlignes med '+top.id+', som står øverst etter '+criteriaLabel()+'. Kostnad og historikk endrer ikke rangeringen.')+'</p></div><div><strong>Usikkerhet</strong><p>Undersøk datagrunnlaget og de berørte vaktene. Et øktvalg eller simulert tilbud innfører ingen endring i den faktiske vaktlisten.</p></div></div><div class="actions"><button data-action="ai" data-testid="explain" '+(!top?'disabled aria-describedby="no-reference"':'')+'>Forklar forskjellen</button></div>'+(!top?'<p class="hint" id="no-reference">Ingen rangert referanse på dette grunnlaget.</p>':'')+(state.aiNote?'<div class="notice warn" style="margin-top:14px" data-testid="ai-fallback"><strong>Ingen modell tilkoblet.</strong><p>Standardforklaringen beholdes. Regelstatus, rangering og øktvalg er uendret.</p></div>':'')+'</section>';}
  function offerStatus(r){if(!r)return 'Aksept ikke simulert.';const vals=Object.values(r.responses);if(vals.some(x=>x==='declined'))return 'Minst én har avslått i simuleringen.';if(vals.every(x=>x==='accepted'))return 'Alle berørte har akseptert i simuleringen.';return 'Tilbud sendt · venter på svar i simuleringen.';}
  function offers(c){if(state.current!==c.id)return '';const r=record(c.id);return '<section class="detail-section" data-testid="offer-panel"><h3>Tilbudssimulering</h3><p class="small muted">Ingen melding sendes. Svarene beholdes for dette alternativet på '+esc(state.version)+'.</p><p class="offer-summary" data-testid="offer-summary">'+esc(offerStatus(r))+'</p>'+(r?c.people.map(person=>{const response=r.responses[person];return '<div class="offer-person"><div class="offer-head"><strong>'+esc(person)+'</strong>'+badge(response==='accepted'?'Akseptert':response==='declined'?'Avslått':'Venter på svar',response==='accepted'?'good':response==='declined'?'bad':'warn')+'</div><div class="actions"><button class="small" data-action="respond" data-id="'+c.id+'" data-person="'+person+'" data-response="accepted" data-testid="accept-'+person+'">Simuler aksept</button><button class="small" data-action="respond" data-id="'+c.id+'" data-person="'+person+'" data-response="declined" data-testid="decline-'+person+'">Simuler avslag</button><button class="small text" data-action="respond" data-id="'+c.id+'" data-person="'+person+'" data-response="waiting">Sett til ventende</button></div></div>';}).join(''):'<button data-action="offer" data-id="'+c.id+'" data-testid="start-offer">Simuler tilbud</button>')+'<p class="hint" style="margin-top:14px">Full aksept krever ja fra alle berørte. Selv full simulert aksept endrer ikke gjeldende vaktliste.</p></section>';}
  function details(){const c=candidate(state.active);const selectable=c.status==='good'&&state.result==='full'&&state.target==='w';return pageHead('Steg 3 · undersøk','Se hele konsekvensen.','Kontroll, planforslag og datagrunnlag for ett alternativ. Undersøkelse markerer ikke et valg.','<button data-action="back-results" data-testid="back-results">← Til alternativene</button>')+'<div class="layout">'+context()+'<article class="panel" data-testid="candidate-details"><div class="detail-head"><div class="badges" style="margin-bottom:12px">'+badge(c.kind)+badge(status(c),selectable||c.status==='partial'?'good':c.status==='bad'?'bad':'warn')+(c.status==='partial'?badge('Delvis dekning','warn'):'')+'</div><h2>'+esc(c.id==='M01'?'B + C · dekker to berørte vakter':c.id==='PART'?'B → X · Y blir udekket':c.id+' · '+c.kind.toLowerCase())+'</h2><p class="small muted" style="margin-top:8px">'+esc(c.desc)+'</p></div><dl class="fact-grid"><div><dt>Timer før → etter · P1</dt><dd>'+c.before+' → '+c.after+' t</dd></div><div><dt>Andel av avtalte timer · P2</dt><dd>'+(c.contract?dec(c.after/c.contract*100)+' %':'Uavklart')+'</dd></div><div><dt>Forslagets dekning</dt><dd>'+(c.status==='partial'?'Delvis':'Full')+'</dd></div></dl>'+plan(c)+'<section class="detail-section"><h3>Regelkontroll · R1–R5</h3><div class="rule-list">'+ruleRows(c)+'</div><p class="hint">Illustrerte kontrollverdier. R4/R5 er forenklede scenarioregler med lovutgangspunkt og forbehold, ikke full lovkontroll. Ved flytting gjelder kontrollen alle berørte.</p></section><section class="detail-section"><h3>Kostnadsanslag · '+esc(state.version)+'</h3><div class="text-table"><div class="text-row"><strong>Anslag for berørte tildelinger</strong><span>'+(c.cost===null?'Kostnad uavklart · sats mangler':money(c.cost))+'</span></div><div class="text-row"><strong>Gjeldende grunnlag for samme vakter</strong><span>'+money(c.ref)+(c.id==='M01'||c.id==='PART'?' · B på Y':' · udekket målskift')+'</span></div><div class="text-row"><strong>Differanse</strong><span>'+(c.cost===null?'Uavklart':'+'+money(c.cost-c.ref))+'</span></div><div class="text-row"><strong>Timer, satser og tillegg</strong><span>'+(c.id==='M01'?'B: 8 t × 260 kr + C: 8 t × 250 kr. Referanse: B 8 t × 260 kr.':c.cost===null?'8 timer · syntetisk sats mangler.':'8 t × '+c.rate+' kr. Referanse: 0 aktive tildelingstimer.')+'<br><small>Tillegg: 0 kr/t i dette konstruerte eksemplet. NOK.</small></span></div></div><p class="hint">Nye illustrative UX-beløp fra Codex, ikke O1/O2 eller fullstendig demodatasett. Reell overtid, tariff, fraværskostnad, arbeidsgiveravgift og full arbeidsgiverkostnad inngår ikke; utelatte kostnader er ikke satt til null.</p></section><section class="detail-section"><details class="history"><summary>Historikk · uke 1–4</summary><div class="history-body"><p class="small muted">Konstruert eksempel, ikke ferdig historikkdatasett. Kilde: UX-prototype '+esc(state.version)+'. Ingen historisk poengsum brukes.</p><div class="text-table">'+[['Uke 1','24 t · 0 flyttinger'],['Uke 2','32 t · 1 flytting'],['Uke 3','24 t · 0 flyttinger'],['Uke 4','32 t · 0 flyttinger']].map(([w,v])=>'<div class="text-row"><strong>'+w+'</strong><span>'+v+'</span></div>').join('')+'</div><p class="hint">Gjelder hovedkandidaten. Dette UX-eksemplet illustrerer komplett kontrollgrunnlag for viste vakter og nabovakter. Modellering av eksterne vikarers øvrige arbeid er åpent i SCRUM-19; i appen gir manglende nødvendig grunnlag Uavklart. Manglende historikk vises som mangel, ikke som null.</p></div></details></section>'+explanation(c)+'<section class="detail-section"><h3>Ditt valg i økten</h3>'+(state.current===c.id?'<div class="notice"><strong>'+esc(c.id)+' er valgt på '+esc(state.version)+'.</strong><p>Valget er beholdt i økten. Det endrer ikke den faktiske vaktlisten.</p></div>':selectable?'<p class="small muted">Dette komplette alternativet kan markeres som øktvalg. Aksept blir ikke simulert automatisk.</p><div class="actions"><button class="primary" data-action="choose" data-id="'+c.id+'" data-testid="choose">Velg alternativ</button></div>':'<div class="notice warn"><strong>Kan undersøkes, men ikke velges som kontrollert løsning.</strong><p>'+esc(c.status==='bad'?'Et kjent regelavvik må ikke vises som oppfylt.':c.status==='partial'?'Alle berørte vakter må dekkes i et komplett forslag.':'Nødvendige opplysninger mangler. Se datagrunnlaget og foreta en ny vurdering når det er komplettert.')+'</p></div>')+'</section>'+offers(c)+'</article></div>';}
  function data(){const current=state.version;return pageHead('Datagrunnlag','Et nytt grunnlag. En ny vurdering.','Forhåndsvis endringene før du laster et forhåndslaget datasett. Gamle valg og svar beholdes som historikk.','<button data-action="data-back">← Tilbake</button>')+'<div class="data-layout"><section class="panel"><div class="section-title"><h2>Forhåndslaget oppdatering</h2>'+badge(current==='d1'?'d1 → d2':'d2 er gjeldende',current==='d1'?'warn':'good')+'</div><div class="data-diff"><div><h3>Gjeldende · '+esc(current)+'</h3><p>V01: '+(current==='d1'?'tilgjengelighet ikke bekreftet.':'tilgjengelighet bekreftet.')+'</p><p>Bemanning: '+(state.absences.includes(state.target)?'målskiftet er udekket.':'A01 er planlagt.')+'</p><p>Låser, historikk og satser: '+(current==='d1'?'ingen endring foreslått.':'uendret fra d1.')+'</p></div><div><h3>Komplettert · d2</h3><p>V01 er bekreftet tilgjengelig gjennom målskiftet.</p><p>Avtalte timer og kostnadssats mangler fortsatt.</p><p>Ingen vaktendring er innført. Ingen nye låser eller historikkdata.</p></div></div><div class="notice warn"><strong>Tilbudssvar videreføres ikke til nye forslag.</strong><p>Et valg på '+esc(current)+' blir historisk ved bytte. Nye forslag må undersøkes og velges på nytt. Fraværet beholdes som scenariogrunnlag.</p></div>'+(state.error?'<p class="error" role="alert" style="margin-top:18px">'+esc(state.error)+'</p>':'')+'<div class="actions"><button class="primary" data-action="data-confirm" data-testid="data-confirm" '+(current==='d2'?'disabled':'')+'>Last d2 og vurder på nytt</button><button data-action="data-back">Avbryt</button></div><p class="hint">Knappen laster bare lokale UX-eksempler. Den starter ikke et søk automatisk.</p></section><section class="panel" style="margin-top:18px" data-testid="session-history"><h2>Økthistorikk</h2><p class="hint" style="margin-bottom:12px">Beholdes i denne fanen. Ingen varig lagring eller utsending.</p>'+(state.history.length?state.history.map(h=>'<div class="historical-entry"><strong>Historisk valg '+esc(h.id)+' · '+esc(h.version)+'</strong><p>'+esc(h.offer)+' Dette er ikke en vurdering av '+esc(state.version)+'.</p></div>').join(''):'<p class="small muted">Ingen historiske valg ennå.</p>')+'</section></div>';}
  function tools(){return '<details class="prototype-tools"><summary>Prototypekontroller · prøv tilstander</summary><p>Disse kontrollene demonstrerer feil og tomtilstander; de er ikke nye produktfunksjoner. All behandling skjer lokalt i denne filen.</p><div class="tools-actions"><button data-action="mode-normal">Vanlig søkeresultat</button><button data-action="mode-empty" data-testid="force-empty">Vis tomt søkeresultat</button><button data-action="mode-error" data-testid="force-search-error">Vis søkefeil</button><button data-action="load-error" data-testid="force-load-error">Simuler innlastingsfeil</button><button data-action="reset" data-testid="reset">Nullstill demonstrasjonen</button></div></details><footer class="foot"><p>VaktMatch · beslutningsstøtte ved udekket vakt</p><p>SCRUM-47 · illustrativ UX-prototype · 08.11.2026</p></footer>';}
  function render(){document.title='VaktMatch · '+({week:'Ukeplan',absence:'Fravær',results:'Alternativer',details:'Detaljer',data:'Datagrunnlag'}[state.screen]);$('#version-head').textContent=state.version;$('#app').innerHTML=stepNav()+'<main id="main">'+({week,absence,results,details,data}[state.screen])()+'</main>'+tools();}
  function search(){if(!state.simulated){state.error='Simuler fravær for ett valgt målskift før du søker.';go('absence');return;}if(state.target!=='w'){state.result='outside';go('results');announce('Søket er ikke kjørt. Målskiftet er utenfor prototypeeksemplet.');return;}state.result='loading';go('results');announce('Søket er startet.');const requestedVersion=state.version;setTimeout(()=>{if(state.screen!=='results'||state.version!==requestedVersion||!state.simulated)return;state.result=state.mode==='error'?'error':state.mode==='empty'?'empty':'full';render();focusMain();announce(state.result==='full'?'Søket er fullført. Alternativene er klare.':state.result==='error'?'Søket feilet. Prøv igjen.':'Søket er fullført uten kontrollerte alternativer innenfor valgt omfang.');},350);}
  function updatePreview(){const p=period();$('#period-label').textContent=shortDate(p.from)+'–'+shortDate(p.last);$('#affected-list').innerHTML=affectedHTML();$('#absence-state').className='notice warn';$('#absence-state').innerHTML='<strong>Feltene er endret.</strong><p>Simuler fraværet på nytt før du søker. Bare ett valgt målskift behandles.</p>';const searchButton=$('[data-testid="search"]');searchButton.disabled=true;searchButton.classList.remove('primary');$('[data-testid="simulate"]').classList.add('primary');}
  document.addEventListener('input',e=>{if(e.target.id==='days'){state.days=e.target.value;invalidate();const active=affected().find(s=>!s.started);if(!affected().some(s=>s.id===state.target))state.target=active?active.id:'';bindTarget();updatePreview();}});
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='person'){state.person=t.value;invalidate();updatePreview();}
    if(t.id==='start'){state.start=t.value;state.target=t.value;bindTarget();invalidate();updatePreview();}
    if(t.name==='target'){state.target=t.value;bindTarget();invalidate();updatePreview();}
    if(t.dataset.criterion){const p=t.dataset.criterion;if(t.checked){state.criteria.push(p);}else if(state.criteria.length===1){t.checked=true;announce('Minst ett sorteringskriterium må være aktivt.');return;}else state.criteria=state.criteria.filter(x=>x!==p);render();const d=$('[data-testid="search-settings"]');if(d)d.open=true;const input=$('[data-criterion="'+p+'"]');if(input)input.focus();announce('Sorteringen er endret til '+criteriaLabel()+'. Regelstatus og valg er uendret.');}
    if(t.id==='order'){state.criteria=t.value.split(',');render();$('[data-testid="search-settings"]').open=true;$('#order').focus();announce('Prioritert rekkefølge er '+criteriaLabel()+'.');}
    if(t.id==='limit'){state.limit=t.value;state.result='idle';render();$('[data-testid="search-settings"]').open=true;$('#limit').focus();announce('Søkeomfanget er endret. Trykk Finn alternativer på nytt.');}
  });
  document.addEventListener('submit',e=>{
    if(e.target.id!=='absence-form')return;
    e.preventDefault();const n=Number(state.days);state.error='';state.errorField='';
    if(!state.person){state.error='Velg hvilken ansatt som er fraværende.';state.errorField='person';}
    else if(!Number.isInteger(n)||n<1||n>365){state.error='Antall kalenderdager må være et helt tall fra 1 til 365 i denne prototypen.';state.errorField='days';}
    else if(!affected().some(s=>s.id===state.target&&!s.started)){state.error='Velg en tilgjengelig, ikke påbegynt vakt i perioden.';state.errorField='affected-title';}
    else{state.simulated=true;if(!state.absences.includes(state.target))state.absences.push(state.target);state.result='idle';state.notice='';announce('Fraværet er simulert for ett målskift. Finn alternativer er tilgjengelig.');}
    render();if(state.error)$('#form-error').focus();else $('[data-testid="search"]').focus();
  });
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-action]');if(!t||t.disabled)return;const a=t.dataset.action;
    if(a==='nav')go(t.dataset.screen);
    if(a==='absence')go('absence');
    if(a==='back-results'){go('results');requestAnimationFrame(()=>{const b=$('[data-testid="inspect-'+state.active+'"]');if(b)b.focus({preventScroll:true});});}
    if(a==='search')search();
    if(a==='retry'){state.mode='normal';search();}
    if(a==='detail'){state.active=t.dataset.id;state.aiNote=false;go('details');}
    if(a==='ai'){state.aiNote=true;render();$('[data-testid="explain"]').focus();announce('Ingen modell tilkoblet. Standardforklaringen beholdes.');}
    if(a==='choose'){const c=candidate(t.dataset.id);if(c.status!=='good'||state.result!=='full'||state.target!=='w')return;state.current=c.id;state.choices=state.choices||{};state.choices[state.version+':'+state.target]=c.id;render();focusMain();announce(c.id+' er valgt i økten. Vaktlisten er uendret.');}
    if(a==='offer'){const c=candidate(t.dataset.id);if(state.current!==c.id)return;if(!record(c.id))state.records[key(c.id)]={responses:Object.fromEntries(c.people.map(p=>[p,'waiting']))};render();$('[data-testid="offer-summary"]').setAttribute('tabindex','-1');$('[data-testid="offer-summary"]').focus();announce('Tilbud er simulert. Venter på svar fra alle berørte.');}
    if(a==='respond'){const r=record(t.dataset.id);if(!r||state.current!==t.dataset.id)return;r.responses[t.dataset.person]=t.dataset.response;render();const again=$('[data-action="respond"][data-person="'+t.dataset.person+'"][data-response="'+t.dataset.response+'"]');if(again)again.focus();announce(offerStatus(r)+' Den faktiske vaktlisten er uendret.');}
    if(a==='data'){state.returnScreen=state.screen;state.error='';go('data');}
    if(a==='data-back'){go(state.returnScreen==='data'?'week':state.returnScreen);}
    if(a==='data-confirm'){for(const [choiceKey,id] of Object.entries(state.choices||{})){const [version,target]=choiceKey.split(':');if(version===state.version)state.history.push({id,version,target,offer:offerStatus(state.records[[version,target,id].join(':')])});}state.version='d2';state.current=null;state.aiNote=false;state.result='idle';state.notice='d2 er lastet. Gjør en ny vurdering.';go('results');announce('d2 er lastet. Gamle valg og svar er historiske. Start et nytt søk.');}
    if(a.startsWith('mode-')){state.mode=a.slice(5);state.target='w';state.start='w';state.simulated=true;if(!state.absences.includes('w'))state.absences.push('w');bindTarget();state.result=state.mode==='normal'?'full':state.mode==='empty'?'empty':'error';go('results');announce('Prototypekontrollen viser '+(state.mode==='normal'?'vanlig søkeresultat':state.mode==='empty'?'tomt søkeresultat':'søkefeil')+'.');}
    if(a==='load-error'){state.returnScreen=state.screen;state.screen='data';state.error='Kunne ikke laste nye data. Siste gyldige grunnlag '+state.version+' er beholdt. Prøv Last d2 igjen eller avbryt.';render();focusMain();announce(state.error);}
    if(a==='reset'){state=initial();render();focusMain();window.scrollTo(0,0);announce('Demonstrasjonen er nullstilt til d1.');}
  });
  render();
})();
</script>
</body>
</html>
